<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — XL Traders</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        border-radius: 14px;
        background: #dc2626;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      h1 {
        font-size: 18px;
        font-weight: 800;
        margin: 0 0 8px;
      }
      p {
        font-size: 13.5px;
        color: #64748b;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        appearance: none;
        border: none;
        background: #dc2626;
        color: #fff;
        font-weight: 700;
        font-size: 13.5px;
        padding: 12px 20px;
        border-radius: 12px;
        cursor: pointer;
      }
      button:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">XL</div>
      <h1>You're offline</h1>
      <p>Check your connection and try again. Anything you already had open should still work.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
