name: CI

# Type-check + build gate. Runs on every PR into main and on pushes to main.
# Any failing step fails the workflow — a type error (npm run check) blocks the PR.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Type-check first so type errors surface fast, before the longer build.
      - name: Type-check
        run: npm run check

      # Storefront invariants — the price gate, the ordering-arithmetic
      # boundary, banned copy claims. Every rule here exists because breaking
      # it produced a real defect; see docs/STOREFRONT_RULES.md.
      - name: Storefront guardrails
        run: npm run check:storefront

      # Covers orderingModel, the cart/WhatsApp total parity, and the
      # price-entry round-trip regression (all vitest, all on the pinned Node).
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
